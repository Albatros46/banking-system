server:
  port: 8083

spring:
  application:
    name: fraud-detection-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: fraud-detection-service
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.fraud_detection_service.events.TransactionInitiatedEvent

app:
  fraud:
    max-single-amount: 50000
    max-transfers-per-window: 5
    velocity-window: 60s
  kafka:
    topics:
      transaction-initiated: transaction-initiated
      fraud-check-results: fraud-check-results
      fraud-alerts: fraud-alerts
